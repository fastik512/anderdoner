<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Андер Донер — доставка и самовывоз</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
  body { background: #0f0f11; color: #fff; padding-bottom: 80px; }

  header { padding: 16px; border-bottom: 1px solid #222; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 800px; margin: 0 auto; }
  .logo { font-size: 1.8rem; font-weight: 900; color: #ff3333; letter-spacing: 2px; }
  .cart-icon { background: #1a1a1a; padding: 8px 16px; border-radius: 20px; font-weight: bold; border: 1px solid #333; }
  .tagline { text-align: center; color: #666; font-size: 0.8rem; margin-top: 8px; }

  .hero { text-align: center; padding: 40px 16px; background: linear-gradient(180deg, #1a1112 0%, #0f0f11 100%); }
  .hero h2 { font-size: 2rem; margin-bottom: 10px; color: #fff; }
  .hero p { color: #aaa; }

  .category-tabs { 
    display: flex; overflow-x: auto; gap: 10px; padding: 16px; 
    position: sticky; top: 0; background: #0f0f11; z-index: 10; 
    scrollbar-width: none; border-bottom: 1px solid #222;
  }
  .category-tabs::-webkit-scrollbar { display: none; }
  .tab-btn { 
    background: #1a1a1a; border: 1px solid #333; color: #888; 
    padding: 10px 20px; border-radius: 30px; white-space: nowrap; font-size: 1rem;
  }
  .tab-btn.active { background: #ff3333; color: #fff; border-color: #ff3333; font-weight: bold; }

  .menu-grid { 
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
    gap: 16px; padding: 16px; max-width: 800px; margin: 0 auto;
  }
  .item-card { 
    background: #1a1a1a; border-radius: 16px; padding: 16px; 
    border: 1px solid #222; display: flex; flex-direction: column; justify-content: space-between;
  }
  .item-card .name { font-weight: bold; font-size: 1.1rem; margin-bottom: 4px; }
  .item-card .desc { font-size: 0.8rem; color: #888; line-height: 1.3; margin-bottom: 8px; }
  .item-card .weight { font-size: 0.75rem; color: #555; margin-bottom: 12px; }
  .item-card .bottom { display: flex; justify-content: space-between; align-items: center; }
  .item-card .price { font-size: 1.1rem; font-weight: 900; color: #ff3333; }
  .item-card .buy-btn { background: #333; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .item-card .buy-btn:active { background: #ff3333; }

  .unique-feature { padding: 32px 16px; max-width: 800px; margin: 0 auto; }
  .unique-feature h2 { text-align: center; color: #ff3333; margin-bottom: 20px; }
  .builder { background: #1a1a1a; padding: 20px; border-radius: 16px; border: 1px solid #333; }
  .builder-step { margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .builder-step span { font-weight: bold; margin-right: 8px; color: #aaa; width: 100%; }
  .opt-btn { background: #222; border: 1px solid #444; color: #ccc; padding: 8px 14px; border-radius: 20px; cursor: pointer; }
  .opt-btn.active { background: #fff; color: #000; border-color: #fff; font-weight: bold; }
  .add-custom-btn { width: 100%; background: #ff3333; color: #fff; border: none; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 1rem; margin-top: 10px; cursor: pointer; }

  #contacts { text-align: center; padding: 40px 16px; color: #888; border-top: 1px solid #222; margin-top: 40px; }
  #contacts h2 { color: #fff; margin-bottom: 16px; }
  #contacts a { color: #ff3333; text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="top-bar">
    <div class="logo">UNDER DONER</div>
    <div class="cart-icon" id="cart-btn">
      🛒 <span id="cart-count">0</span>
    </div>
  </div>
  <p class="tagline">Шаурма, которая держит строй</p>
</header>

<div class="hero">
  <h2>Лучшая шаурма в городе</h2>
  <p>Свежие ингредиенты, двойное мясо, фирменные соусы.</p>
</div>

<div class="category-tabs" id="category-tabs"></div>
<main class="menu-grid" id="menu-grid"></main>

<div class="unique-feature">
  <h2>Собери свою идеальную шаурму</h2>
  <div class="builder">
    <div class="builder-step">
      <span>Мясо:</span>
      <button class="opt-btn active" onclick="selectOpt(this)">Курица</button>
      <button class="opt-btn" onclick="selectOpt(this)">Говядина</button>
    </div>
    <div class="builder-step">
      <span>Соус:</span>
      <button class="opt-btn active" onclick="selectOpt(this)">Чесночный</button>
      <button class="opt-btn" onclick="selectOpt(this)">Острый</button>
      <button class="opt-btn" onclick="selectOpt(this)">Сырный</button>
    </div>
    <div class="builder-step">
      <span>Добавки:</span>
      <button class="opt-btn" onclick="toggleOpt(this)">Сыр +2.0</button>
      <button class="opt-btn" onclick="toggleOpt(this)">Бекон +3.0</button>
    </div>
    <button class="add-custom-btn" onclick="addCustomToCart()">Добавить в корзину</button>
  </div>
</div>

<section id="contacts">
  <h2>Контакты</h2>
  <p>Адрес: г. Минск, ул. Ленина, 1</p>
  <p>Телефон: <a href="tel:+375XXXXXXXXX">+375 XX XXX-XX-XX</a></p>
  <p>Часы: 10:00 – 23:00</p>
</section>

<script>
  // Данные меню прямо в скрипте (чтобы не грузить отдельный JSON)
  const menuData = {
    categories: [
      { id: "shaurma", name: "Шаурма" },
      { id: "snacks", name: "Закуски" },
      { id: "drinks", name: "Напитки" },
      { id: "sauces", name: "Соусы" }
    ],
    items: [
      { cat: "shaurma", name: "Андер-Классик", desc: "Лаваш, курица, помидор, огурец, капуста, соус", weight: "350 г", price: "12,50 BYN" },
      { cat: "shaurma", name: "Три Сыра", desc: "Курица, моцарелла, чеддер, фета, помидор, сырный соус", weight: "400 г", price: "15,50 BYN" },
      { cat: "shaurma", name: "Острый Дьявол", desc: "Курица, халапеньо, перец чили, острый соус, лук", weight: "380 г", price: "13,99 BYN" },
      { cat: "shaurma", name: "С Креветкой", desc: "Королевская креветка, айсберг, помидор, соус Цезарь", weight: "400 г", price: "16,50 BYN" },
      { cat: "shaurma", name: "Грибной Донер", desc: "Курица, шампиньоны, сыр, чесночный соус", weight: "420 г", price: "14,00 BYN" },
      { cat: "shaurma", name: "Гавайский", desc: "Курица, ананас, капуста, кисло-сладкий соус", weight: "450 г", price: "13,99 BYN" },
      { cat: "shaurma", name: "Биг Тейсти", desc: "Двойная курица, бекон, сыр, соус гриль", weight: "500 г", price: "17,00 BYN" },
      { cat: "snacks", name: "Картофель фри", desc: "Хрустящий, с солью", weight: "150 г", price: "5,00 BYN" },
      { cat: "snacks", name: "Наггетсы", desc: "Куриные, 6 шт", weight: "120 г", price: "6,50 BYN" },
      { cat: "snacks", name: "Креветки в панировке", desc: "7 шт, с соусом", weight: "100 г", price: "11,99 BYN" },
      { cat: "drinks", name: "Coca-Cola", desc: "Классическая, 0.5 л", weight: "500 мл", price: "3,50 BYN" },
      { cat: "drinks", name: "Сок Добрый", desc: "Апельсин / Яблоко, 0.3 л", weight: "300 мл", price: "2,50 BYN" },
      { cat: "sauces", name: "Чесночный", desc: "Классический белый соус", weight: "30 г", price: "1,20 BYN" },
      { cat: "sauces", name: "Барбекю", desc: "Копченый, сладковатый", weight: "30 г", price: "1,20 BYN" },
      { cat: "sauces", name: "Сырный", desc: "С добавлением чеддера", weight: "30 г", price: "1,20 BYN" }
    ]
  };

  let cartCount = 0;

  document.getElementById('cart-btn').addEventListener('click', () => {
    alert('В корзине товаров: ' + cartCount);
  });

  function updateCart() {
    cartCount++;
    document.getElementById('cart-count').textContent = cartCount;
  }

  function renderMenu(catId) {
    const grid = document.getElementById('menu-grid');
    grid.innerHTML = '';
    const filtered = menuData.items.filter(i => i.cat === catId);
    
    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <div>
          <div class="name">${item.name}</div>
          <div class="desc">${item.desc}</div>
          <div class="weight">${item.weight}</div>
        </div>
        <div class="bottom">
          <div class="price">${item.price}</div>
          <button class="buy-btn">+</button>
        </div>
      `;
      card.querySelector('.buy-btn').onclick = () => updateCart();
      grid.appendChild(card);
    });
  }

  // Рендер вкладок
  const tabsContainer = document.getElementById('category-tabs');
  menuData.categories.forEach((cat, index) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (index === 0 ? ' active' : '');
    btn.textContent = cat.name;
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMenu(cat.id);
    };
    tabsContainer.appendChild(btn);
  });

  // Первый рендер
  renderMenu('shaurma');

  // Конструктор
  function selectOpt(btn) {
    const parent = btn.parentElement;
    parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function toggleOpt(btn) {
    btn.classList.toggle('active');
  }

  function addCustomToCart() {
    updateCart();
    alert('Твоя уникальная шаурма добавлена в корзину!');
  }
</script>
</body>
</html>
