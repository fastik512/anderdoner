<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Андер Донер — шаурма</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">АНДЕР ДОНЕР</div>
  <p class="tagline">Шаурма, которая держит строй</p>
</header>

<section id="hero">
  <div class="shaurma-container">
    <div class="shaurma" id="shaurma">
      <div class="layer meat"></div>
      <div class="layer veggie"></div>
      <div class="layer sauce"></div>
      <div class="layer pita"></div>
      <div class="ingredient-label" id="ing-label">Мясо</div>
    </div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" data-layer="meat" data-label="Сочное мясо">1</button>
    <button class="ctrl-btn" data-layer="veggie" data-label="Свежие овощи">2</button>
    <button class="ctrl-btn" data-layer="sauce" data-label="Фирменный соус">3</button>
    <button class="ctrl-btn" data-layer="pita" data-label="Хрустящий лаваш">4</button>
  </div>
</section>

<section id="promo">
  <h2>Акции</h2>
  <div id="promo-list"></div>
</section>

<section id="menu">
  <h2>Меню</h2>
  <div id="menu-list"></div>
</section>

<section id="contacts">
  <h2>Контакты</h2>
  <p>Адрес: [впиши свой]</p>
  <p>Телефон: <a href="tel:+7XXXXXXXXXX">+7 XXX XXX-XX-XX</a></p>
  <p>Часы: 10:00 – 23:00</p>
  <a class="btn" href="https://wa.me/7XXXXXXXXXX">Заказать в WhatsApp</a>
</section>

<script src="script.js"></script>
</body>
</html>
